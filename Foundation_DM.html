<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .shape {
            width: 100px;
            height: 100px;
            background-color: red;
            margin: 20px auto;
        }
        @media(max-width:600px){
            body{
                background-color: green;
            }
            .shape {
                border-radius: 0; /* Square */
            }

        }
        @media(min-width:601px) and (max-width:900px){
            body{
                background-color: yellow;
            }
             .shape {
               width: 150px;
               height: 100px; /* Rectangle */
            }
        }
        @media(min-width:901px){
            body{
                background-color: blue;
            }
             .shape {
                border-radius: 50%; /* Square */
            }
        }
        
    </style>
</head>
<body>
    make a div and chage its shape according to the screen size using media queries. For example, you can create a div that is a square on small screens, a rectangle on medium screens, and a circle on large screens.
    <div class="shape"></div>
</body>
</html>
